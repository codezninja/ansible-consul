---
# File: config.yml - Consul configuration tasks

- name: Create configuration
  ansible.builtin.copy:
    dest: "{{ config_item.dest }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    content: "{{ lookup('template', consul_config_template_path) }}"
    mode: "0600"
  with_items:
    - dest: "{{ consul_config_path }}/config.json"
      config_version: "{{ consul_node_role }}"
      when: true
    - dest: "{{ consul_config_path }}/bootstrap.json"
      config_version: bootstrap
      when: "{{ consul_debug | bool }}"
    - dest: "{{ consul_config_path }}/server.json"
      config_version: server
      when: "{{ consul_debug | bool }}"
    - dest: "{{ consul_config_path }}/client.json"
      config_version: client
      when: "{{ consul_debug | bool }}"
  loop_control:
    loop_var: config_item
  when: config_item.when
  notify:
    - restart consul

- name: Create custom configuration
  ansible.builtin.copy:
    dest: "{{ consul_configd_path }}/50custom.json"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    content: "{{ lookup('template', 'templates/configd_50custom.json.j2') }}"
    mode: "0600"
  when: consul_config_custom is defined
  notify:
    - restart consul

- name: Set fact list with custom configuration file
  ansible.builtin.set_fact:
    managed_files: "{{ managed_files | default([]) }} + [ '{{ consul_configd_path }}/50custom.json' ]"

# All configuration files must be given to the validate command at once (partial conf might raise some issue regarding missing some required items), so it's not possible to use the validate arg og the ansibvle.builtin.copy module used to template the config
# Install ACL package to support Ansible 2.18.6 ACL syntax on Linux systems
# See: https://github.com/ansible/ansible/issues/85503
- name: Install ACL package for privilege escalation compatibility
  ansible.builtin.package:
    name: acl
    state: present
  become: true
  when: ansible_os_family in ['Debian', 'RedHat', 'Archlinux']

- name: Debug - Read main config.json file
  ansible.builtin.slurp:
    src: "{{ consul_config_path }}/config.json"
  register: config_json_content

- name: Debug - Show main config.json content
  ansible.builtin.debug:
    msg: "{{ config_json_content['content'] | b64decode }}"

- name: Debug - Read custom config file if it exists
  ansible.builtin.slurp:
    src: "{{ consul_configd_path }}/50custom.json"
  register: custom_config_content
  when: consul_config_custom is defined
  ignore_errors: true

- name: Debug - Show custom config content
  ansible.builtin.debug:
    msg: "{{ custom_config_content['content'] | b64decode }}"
  when: consul_config_custom is defined and custom_config_content is defined

- name: Validate configuration (with become_user and ACL support)
  become: true
  become_user: "{{ consul_user }}"
  ansible.builtin.command: >
    {{ consul_binary }} validate {{ (ansible_verbosity == 0) | ternary("-quiet", "") }}
    {{ consul_config_path }}/config.json {{ consul_configd_path }}
  changed_when: false
