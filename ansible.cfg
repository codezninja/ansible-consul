[defaults]
# Ansible configuration for consul role
stdout_callback = yaml
bin_ansible_callbacks = True
# Explicitly disable ACL usage to prevent macOS syntax on Linux
ansible_acl = False
# Force become method and flags
become_method = sudo
become_flags = -H -S -n

[privilege_escalation]
# Fix for Linux compatibility - avoid macOS ACL syntax
become_allow_same_user = True
become_flags = -H -S -n
become_method = sudo

[ssh_connection]
# Improve SSH connection stability
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
